# Public site (ifleon.com): check the code, then rebuild its Docker container on the VPS.
# Runs on every push to main that touches site/, or by hand from the Actions tab.
# The SSH key in VPS_SSH_KEY can only run /opt/ifleon/deploy.sh on the server (see backend/deploy.sh),
# which backs up, swaps the code in, rebuilds, health-checks and rolls back on failure.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npx eslint .

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          tar -cz -C site --exclude=node_modules --exclude=.next --exclude='.env*' . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@"$VPS_HOST" site
