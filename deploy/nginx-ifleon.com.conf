# ifleon.com on the VPS (not active yet: enable it at cutover, after DNS points here).
# The site is the Next.js server in the `site` container (backend/docker-compose.yml) on 127.0.0.1:3200.
# It handles pages, 404s and the redirects for old WordPress URLs itself; Nginx only adds TLS.
# HTTPS lines are added by certbot (`certbot --nginx -d ifleon.com -d www.ifleon.com`).

server {
    listen 80;
    listen [::]:80;
    server_name www.ifleon.com;
    return 301 https://ifleon.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ifleon.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (don't append) so visitors can't spoof their IP; the contact form rate limit relies on it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
