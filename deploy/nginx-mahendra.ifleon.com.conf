# mahendra.ifleon.com: the personal portfolio (container ifleon-portfolio on 127.0.0.1:3300).
# Install as /etc/nginx/sites-available/mahendra.ifleon.com, link it into sites-enabled, then once the
# DNS A record points at this VPS run certbot (it adds the HTTPS lines).
server {
    listen 80;
    server_name mahendra.ifleon.com;

    # The portfolio has no uploads or forms.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
