# testing.ifleon.com: test copy of the new site (live on the VPS; certbot adds the HTTPS lines).
server {
    listen 80;
    server_name testing.ifleon.com;

    client_max_body_size 1m;

    # Test copy of the new site: keep it out of search results (it duplicates ifleon.com).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append, so clients cannot spoof their IP past the contact-form rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
